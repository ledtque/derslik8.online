<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Word Hoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: one centered column app; home dashboard → learn cards → quiz → results. Track colors code word type everywhere. */
:root{
  --bg:#F1F2F7; --surface:#FFFFFF; --ink:#16192B; --muted:#5D6280; --line:#DDE0EC;
  --accent:#3445D6; --accent-ink:#FFFFFF; --gold:#E8A317;
  --power:#3445D6; --rare:#8B3FB8; --idiom:#0E8A7E; --slang:#D9483B;
  --good:#1F9D55; --bad:#D64545; --soft:#E7E9F4; --hero:#3445D6; --hero-ink:#FFFFFF; --on-sem:#FFFFFF;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1120; --surface:#181B2E; --ink:#ECEEF8; --muted:#9CA1C0; --line:#2A2E48;
  --accent:#7F8CFF; --accent-ink:#0F1120; --gold:#F2BC45;
  --power:#8C97FF; --rare:#C88AEB; --idiom:#3CC8B8; --slang:#FF7C6E;
  --good:#46CC80; --bad:#FF6B6B; --soft:#222641; --hero:#2B37A6; --hero-ink:#F3F4FF; --on-sem:#0F1120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1120; --surface:#181B2E; --ink:#ECEEF8; --muted:#9CA1C0; --line:#2A2E48;
  --accent:#7F8CFF; --accent-ink:#0F1120; --gold:#F2BC45;
  --power:#8C97FF; --rare:#C88AEB; --idiom:#3CC8B8; --slang:#FF7C6E;
  --good:#46CC80; --bad:#FF6B6B; --soft:#222641; --hero:#2B37A6; --hero-ink:#F3F4FF; --on-sem:#0F1120; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:4px;background:var(--accent);transform:rotate(12deg);display:inline-block}
.stats{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem}
.pill svg{width:16px;height:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--muted)}
.hero{display:flex;flex-direction:column;gap:14px}
.hero h2{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1}
.plan{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;border:1.5px solid currentColor}
.t-power{color:var(--power)}.t-rare{color:var(--rare)}.t-idiom{color:var(--idiom)}.t-slang{color:var(--slang)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 22px;font-weight:800;font-family:var(--display);font-size:1.1rem;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.peek{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:2px}
.peek b{font-family:var(--display);font-size:1.25rem}
.peek span{color:var(--muted)}
/* roadmap */
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:12px}
.dot{aspect-ratio:1;max-width:100%;border-radius:10px;display:grid;place-items:center;font-size:.8rem;font-weight:700;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.dot.done{background:var(--accent);color:var(--accent-ink)}
.dot.now{outline:2.5px solid var(--gold);outline-offset:1px;color:var(--ink);background:var(--surface)}
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:440px){.tracks{grid-template-columns:1fr}}
.track{display:flex;flex-direction:column;gap:6px;min-width:0}
.track .nm{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem}
.track .nm span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:99px;transition:width .5s}
.lvl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lvl h3{font-size:1.2rem}
.lvl .bar{margin-top:8px;color:var(--gold)}
.lvl small{color:var(--muted);font-variant-numeric:tabular-nums}
/* session */
.sesshead{display:flex;align-items:center;gap:12px}
.sesshead .bar{flex:1;height:12px;color:var(--good)}
.x{background:none;border:0;font-size:1.6rem;line-height:1;color:var(--muted);padding:4px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;min-height:320px}
.card .term{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,8vw,2.8rem);line-height:1.05;overflow-wrap:anywhere}
.card .def{font-size:1.15rem}
.card .ex{font-style:italic;color:var(--muted);border-left:3px solid var(--line);padding-left:12px}
.card .ex em{font-style:normal;font-weight:700;color:var(--ink)}
.speak{background:var(--soft);border:0;border-radius:10px;padding:6px 10px;font-weight:700;font-size:.85rem;color:var(--muted)}
.q{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.25}
.q .big{display:block;font-size:clamp(1.8rem,7vw,2.4rem);font-weight:800;margin-top:4px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--accent);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:1rem;transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt kbd{font-family:var(--body);font-size:.75rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;flex:none;margin-top:2px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface));animation:shake .3s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:color-mix(in srgb,var(--good) 14%,var(--surface));border:1px solid var(--good)}
.feedback.no{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border:1px solid var(--bad)}
.feedback h3{font-size:1.1rem}
.combo{font-family:var(--display);font-weight:800;color:var(--gold);font-size:.95rem}
.result{text-align:center;align-items:center}
.result .big{font-family:var(--display);font-weight:800;font-size:3.2rem;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.grid3 div{background:var(--soft);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column}
.grid3 b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.grid3 span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.85rem}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item:last-child{border-bottom:0}
.item>div{min-width:0;flex:1}
.item b{font-family:var(--display);font-size:1.1rem}
.item p{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.mast{display:flex;gap:3px;flex:none;margin-top:8px}
.mast i{width:7px;height:7px;border-radius:50%;background:var(--soft)}
.mast i.on{background:var(--gold)}
.foot{color:var(--muted);font-size:.85rem;text-align:center}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem}
.note{font-size:.85rem;color:var(--muted)}

/* ---- v3 layout ---- */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:26px 22px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.hero::after{content:"Aa";position:absolute;right:-10px;bottom:-34px;font-family:var(--display);font-weight:800;font-size:9rem;line-height:1;opacity:.12;pointer-events:none}
.hero .label{color:inherit;opacity:.8}
.hero h2{font-size:clamp(1.8rem,7vw,2.5rem);line-height:1.05}
.hero p{margin:0;opacity:.9;max-width:46ch}
.hero .row{margin-top:6px;position:relative;z-index:1}
.hero .peek{border-top:1px solid color-mix(in srgb,var(--hero-ink) 25%,transparent);margin-top:8px;padding-top:12px;position:relative;z-index:1}
.hero .peek span{color:inherit;opacity:.8}
.hero .peek b{font-size:1.4rem}
.hero .err{color:inherit;background:color-mix(in srgb,var(--bad) 70%,transparent);padding:8px 12px;border-radius:10px}
.hero .spin{border-color:color-mix(in srgb,var(--hero-ink) 25%,transparent);border-top-color:var(--hero-ink)}
.btn.inv{background:var(--hero-ink);color:var(--hero);box-shadow:0 4px 0 color-mix(in srgb,var(--hero) 50%,#000)}
.btn.line{background:transparent;color:inherit;border:2px solid color-mix(in srgb,var(--hero-ink) 45%,transparent);box-shadow:none}
.tiles{display:grid;grid-template-columns:1fr 1fr 2fr;gap:10px}
@media (max-width:520px){.tiles{grid-template-columns:1fr 1fr}.tile.wide{grid-column:1/-1}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b.fl{display:flex;align-items:center;gap:4px}.tile svg{width:22px;height:22px}
.tile b{font-family:var(--display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile b.lvname{font-size:1.2rem}
.tile span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.tile .bar{margin:6px 0 2px}
.bar.gold{color:var(--gold)}
.lvl h3{font-size:1.25rem}
.segs{display:flex;gap:4px;margin-top:16px}
.seg{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.segbar{height:10px;border-radius:4px;background:var(--soft);overflow:hidden}
.segbar i{display:block;height:100%;background:var(--accent)}
.seg b{font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg span{font-size:.72rem;font-variant-numeric:tabular-nums}
.seg.cur{color:var(--ink)}
.seg.cur .segbar{outline:2px solid var(--gold);outline-offset:1px}

.trks{display:grid;grid-template-columns:repeat(2,1fr);gap:0 24px;margin-top:18px}
@media (max-width:440px){.trks{grid-template-columns:1fr}}
.trk{border-bottom:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:10px;min-width:0}
.trk span{flex:1;font-size:.95rem}
.trk b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;background:currentColor;flex:none}
.link{background:none;border:0;padding:14px 0 0;color:var(--accent);font-weight:700;text-align:left}
.settings{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:0 4px}
.settings>span{font-weight:700;font-size:.92rem}
.settings small{flex-basis:100%;color:var(--muted)}
.panel{border-radius:20px}
/* session screens: card up top, actions docked to the bottom of the screen */
body:has(.sess){padding-bottom:0}
.sess{min-height:calc(100dvh - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sess .card{min-height:0}
.card.learn{padding-block:34px;gap:16px}
.card.learn .term{font-size:clamp(2.2rem,9vw,3.2rem)}
.dock{margin-top:auto;position:sticky;bottom:0;z-index:5;background:var(--bg);margin-inline:-4px;padding:12px 4px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;border-radius:20px 20px 0 0}
.dock .btn{width:100%}
.dock .hint{margin:0;text-align:center;color:var(--muted);font-size:.9rem;padding:14px 0}
.dock.ok,.dock.no{animation:rise .22s ease-out;padding-inline:16px;margin-inline:-16px;border-radius:22px 22px 0 0}
.dock.ok{background:color-mix(in srgb,var(--good) 16%,var(--bg));box-shadow:0 -1px 0 var(--good)}
.dock.no{background:color-mix(in srgb,var(--bad) 13%,var(--bg));box-shadow:0 -1px 0 var(--bad)}
.dock.ok h3{color:var(--good)}.dock.no h3{color:var(--bad)}
.dock.ok .btn{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 55%,#000);color:var(--on-sem)}
.dock.no .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000);color:var(--on-sem)}
.feedback{padding:4px 0 0;gap:6px}
.feedback h3{font-size:1.2rem}
@keyframes rise{from{transform:translateY(16px);opacity:.4}}
.opt{font-size:1.05rem;padding:14px 16px}
@media (pointer:coarse){.opt kbd{display:none}}
.q{margin-bottom:4px}
.result{gap:16px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.q .sub{display:block;font-weight:500;font-family:var(--body);font-size:1.15rem;margin-top:8px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{margin:0;color:var(--bad);font-weight:600;font-size:.92rem}
.stages{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.stage{display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.stage .nm{display:flex;justify-content:space-between;gap:8px;font-size:.92rem;font-variant-numeric:tabular-nums}
.stage .nm b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--soft);font-size:.75rem;margin-right:4px}
.stage .bar i{background:var(--muted)}
.stage.cur{color:var(--ink);font-weight:700}.stage.cur .bar i{background:var(--accent)}.stage.cur .nm b{background:var(--accent);color:var(--accent-ink)}
.stage.done .bar i{background:var(--good)}
.tcounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
@media (max-width:440px){.tcounts{grid-template-columns:repeat(2,1fr)}}
.tc{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;min-width:0}
.tc b{font-family:var(--display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.tc span{font-size:.8rem;font-weight:700}
.srch{width:100%;font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
</style>
<style>
:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:max(20px,env(safe-area-inset-top,0px))}
.gate{max-width:420px;margin:12vh auto 0;display:flex;flex-direction:column;align-items:flex-start;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px}
.gate h2{font-size:1.8rem}
.gate p{margin:0;color:var(--muted)}
.gate .spin{margin-top:6px}
.acct{cursor:pointer;color:var(--muted);font-size:.85rem}
#sync{width:8px;height:8px;border-radius:50%;background:var(--line)}
#sync[data-s="ok"]{background:var(--good)}
#sync[data-s="err"]{background:var(--bad)}
</style>
</head>
<body>
<main class="app" id="app"></main>
<canvas id="confetti" hidden></canvas>
<script type="module" src="app.js"></script>
</body>
</html>
